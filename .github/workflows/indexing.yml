name: Daily Google Indexing Submission

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we have permissions to push changes back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Service Account Key File
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' > service-account.json

      - name: Run Indexing Script
        run: npm run indexing

      - name: Commit state file changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add tools/indexing-state.json
          # Only commit and push if the state file changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update indexing state [skip ci]" && git push)
